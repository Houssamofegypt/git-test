[project]
name = "quranlab"
version = "0.1.0"
description = "Reproducible infrastructure for Quranic text research"
requires-python = ">=3.11"
dependencies = []          # stdlib only: sqlite3, tomllib, urllib, unicodedata

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
quranlab = "quranlab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
